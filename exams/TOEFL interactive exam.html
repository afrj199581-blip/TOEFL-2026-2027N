
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive TOEFL Mock Exam</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
    :root {
        --primary: #1a5276;
        --secondary: #e74c3c;
        --bg: #f4f6f7;
        --correct: #27ae60;
        --incorrect: #c0392b;
    }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg);
        margin: 0;
        padding: 0;
        color: #333;
    }
    .header {
        background-color: var(--primary);
        color: white;
        text-align: center;
        padding: 20px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .header h1 { margin: 0; font-size: 24px; }
    .header h2 { margin: 5px 0 0 0; font-size: 16px; font-weight: 400; color: #d4e6f1; }
    
    .container {
        max-width: 900px;
        margin: 30px auto;
        background: white;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        overflow: hidden;
        position: relative;
        min-height: 500px;
        display: flex;
        flex-direction: column;
    }
    
    .progress-bar {
        height: 6px;
        background-color: #e0e0e0;
        width: 100%;
    }
    .progress-fill {
        height: 100%;
        background-color: var(--secondary);
        width: 0%;
        transition: width 0.3s ease;
    }
    
    .section-badge {
        display: inline-block;
        background: #f39c12;
        color: white;
        padding: 5px 15px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 14px;
        margin: 20px;
    }
    
    .content-area {
        padding: 20px;
        flex-grow: 1;
    }
    
    .passage-box {
        background-color: #ebf5fb;
        padding: 15px;
        border-left: 4px solid var(--primary);
        margin-bottom: 20px;
        font-family: 'Times New Roman', serif;
        font-size: 16px;
        line-height: 1.6;
        display: none;
    }
    
    .question-title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 15px;
    }
    
    .hint-btn {
        background: none;
        border: none;
        color: #f39c12;
        cursor: pointer;
        font-size: 14px;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .hint-btn:hover { text-decoration: underline; }
    
    .hint-text {
        display: none;
        background: #fef9e7;
        padding: 10px;
        border-left: 3px solid #f39c12;
        margin-bottom: 15px;
        font-size: 14px;
        color: #7e5109;
        direction: rtl;
        text-align: right;
    }
    
    .options {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    
    .option {
        padding: 12px 15px;
        border: 2px solid #ecf0f1;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 16px;
        display: flex;
        align-items: center;
    }
    .option:hover:not(.disabled) {
        background-color: #f4f6f7;
        border-color: #bdc3c7;
    }
    .option.disabled {
        cursor: default;
    }
    .option.correct {
        background-color: #d4edda;
        border-color: var(--correct);
        color: #155724;
    }
    .option.incorrect {
        background-color: #f8d7da;
        border-color: var(--incorrect);
        color: #721c24;
    }
    
    .explanation-box {
        display: none;
        margin-top: 20px;
        padding: 15px;
        background-color: #e8f8f5;
        border-left: 4px solid var(--correct);
        border-radius: 4px;
        font-size: 15px;
        line-height: 1.6;
        animation: fadeIn 0.5s;
    }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        padding: 20px;
        background-color: #fdfefe;
        border-top: 1px solid #ecf0f1;
    }
    
    .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: background 0.2s;
    }
    .btn-prev { background-color: #bdc3c7; color: white; }
    .btn-prev:hover { background-color: #95a5a6; }
    .btn-next { background-color: var(--primary); color: white; }
    .btn-next:hover { background-color: #154360; }
    .btn-submit { background-color: var(--secondary); color: white; display: none; }
    .btn-submit:hover { background-color: #c0392b; }
    
    .results-screen {
        display: none;
        padding: 30px;
        text-align: center;
    }
    .results-screen h2 { color: var(--primary); font-size: 28px; }
    .score-circle {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: var(--primary);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        font-weight: bold;
        margin: 20px auto;
    }
    .feedback {
        background: #fdf2e9;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #e67e22;
        margin-top: 20px;
        font-size: 16px;
        line-height: 1.6;
        direction: rtl;
    }
</style>
</head>
<body>

    <div class="header">
        <h1>Suez University - English & Translation Center</h1>
        <h2>Interactive TOEFL Simulator | By Gemini</h2>
    </div>
    
    <div class="container" id="exam-container">
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        
        <div class="section-badge" id="section-badge">Section 1: Vocabulary</div>
        
        <div class="content-area">
            <div class="passage-box" id="passage-box"></div>
            
            <div class="question-title" id="question-title">Loading...</div>
            
            <button class="hint-btn" onclick="toggleHint()"><i class="fa-solid fa-lightbulb"></i> Show Hint (إظهار التلميح)</button>
            <div class="hint-text" id="hint-text"></div>
            
            <div class="options" id="options-container">
                <!-- Options injected by JS -->
            </div>
            
            <div class="explanation-box" id="explanation-box"></div>
        </div>
        
        <div class="nav-buttons">
            <button class="btn btn-prev" id="btn-prev" onclick="goPrev()"><i class="fa-solid fa-arrow-left"></i> Previous</button>
            <button class="btn btn-next" id="btn-next" onclick="goNext()">Next <i class="fa-solid fa-arrow-right"></i></button>
            <button class="btn btn-submit" id="btn-submit" onclick="submitExam()"><i class="fa-solid fa-flag-checkered"></i> Finish Exam</button>
        </div>
    </div>
    
    <div class="container results-screen" id="results-screen">
        <h2>Exam Completed!</h2>
        <div class="score-circle" id="final-score">0/140</div>
        <h3>Section Breakdown:</h3>
        <p>Vocabulary: <span id="score-sec1">0</span>/50</p>
        <p>Structure: <span id="score-sec2">0</span>/40</p>
        <p>Reading: <span id="score-sec3">0</span>/50</p>
        <div class="feedback" id="feedback-text"></div>
    </div>

<script>
    const questions = [{"section": 1, "q": "What is the closest meaning to the word/phrase <b>\"outran\"</b>?", "options": ["hid from", "shouted at", "walked behind", "ran faster than"], "ans": 3, "hint": "Hint: Speed comparison. (\u062a\u0644\u0645\u064a\u062d: \u0645\u0642\u0627\u0631\u0646\u0629 \u0641\u064a \u0627\u0644\u0633\u0631\u0639\u0629)", "exp": "<b>English:</b> The correct synonym for 'outran' is 'ran faster than'.<br><b>\u0639\u0631\u0628\u064a:</b> \u0627\u0644\u0645\u0631\u0627\u062f\u0641 \u0627\u0644\u0635\u062d\u064a\u062d \u0644\u0643\u0644\u0645\u0629 'outran' \u0647\u0648 'ran faster than'."}, {"section": 1, "q": "What is the closest meaning to the word/phrase <b>\"cost a fortune\"</b>?", "options": ["is a good deal", "is free", "is made of gold", "is very expensive"], "ans": 3, "hint": "Hint: Relates to a large amount of money. (\u062a\u0644\u0645\u064a\u062d: \u064a\u062a\u0639\u0644\u0642 \u0628\u0645\u0628\u0644\u063a \u0643\u0628\u064a\u0631 \u0645\u0646 \u0627\u0644\u0645\u0627\u0644)", "exp": "<b>English:</b> The correct synonym for 'cost a fortune' is 'is very expensive'.<br><b>\u0639\u0631\u0628\u064a:</b> \u0627\u0644\u0645\u0631\u0627\u062f\u0641 \u0627\u0644\u0635\u062d\u064a\u062d \u0644\u0643\u0644\u0645\u0629 'cost a fortune' \u0647\u0648 'is very expensive'."}, {"section": 1, "q": "What is the closest meaning to the word/phrase <b>\"to the letter\"</b>?", "options": ["in writing", "exactly as instructed", "sent by mail", "ignored"], "ans": 1, "hint": "Hint: Following rules strictly. (\u062a\u0644\u0645\u064a\u062d: \u0627\u062a\u0628\u0627\u0639 \u0627\u0644\u0642\u0648\u0627\u0639\u062f \u0628\u062d\u0630\u0627\u0641\u064a\u0631\u0647\u0627)", "exp": "<b>English:</b> The correct synonym for 'to the letter' is 'exactly as instructed'.<br><b>\u0639\u0631\u0628\u064a:</b> \u0627\u0644\u0645\u0631\u0627\u062f\u0641 \u0627\u0644\u0635\u062d\u064a\u062d \u0644\u0643\u0644\u0645\u0629 'to the letter' \u0647\u0648 'exactly as instructed'."}, {"section": 1, "q": "What is the closest meaning to the word/phrase <b>\"fell apart\"</b>?", "options": ["stayed calm", "was built strongly", "succeeded", "became emotionally upset"], "ans": 3, "hint": "Hint: Emotional breakdown. (\u062a\u0644\u0645\u064a\u062d: \u0627\u0646\u0647\u064a\u0627\u0631 \u0639\u0627\u0637\u0641\u064a)", "exp": "<b>English:</b> The correct synonym for 'fell apart' is 'became emotionally upset'.<br><b>\u0639\u0631\u0628\u064a:</b> \u0627\u0644\u0645\u0631\u0627\u062f\u0641 \u0627\u0644\u0635\u062d\u064a\u062d \u0644\u0643\u0644\u0645\u0629 'fell apart' \u0647\u0648 'became emotionally upset'."}, {"section": 1, "q": "What is the closest meaning to the word/phrase <b>\"drawn out\"</b>?", "options": ["very brief", "exciting", "excessively long", "well drawn"], "ans": 2, "hint": "Hint: Taking more time than necessary. (\u062a\u0644\u0645\u064a\u062d: \u064a\u0633\u062a\u063a\u0631\u0642 \u0648\u0642\u062a\u0627\u064b \u0623\u0637\u0648\u0644 \u0645\u0646 \u0627\u0644\u0644\u0627\u0632\u0645)", "exp": "<b>English:</b> The correct synonym for 'drawn out' is 'excessively long'.<br><b>\u0639\u0631\u0628\u064a:</b> \u0627\u0644\u0645\u0631\u0627\u062f\u0641 \u0627\u0644\u0635\u062d\u064a\u062d \u0644\u0643\u0644\u0645\u0629 'drawn out' \u0647\u0648 'excessively long'."}, {"section": 1, "q": "What is the closest meaning to the word/phrase <b>\"menial\"</b>?", "options": ["attractive", "highly paid", "degrading / unskilled", "professional"], "ans": 2, "hint": "Hint: Low-status work. (\u062a\u0644\u0645\u064a\u062d: \u0639\u0645\u0644 \u0645\u062a\u0648\u0627\u0636\u0639 \u0623\u0648 \u0648\u0636\u064a\u0639)", "exp": "<b>English:</b> The correct synonym for 'menial' is 'degrading / unskilled'.<br><b>\u0639\u0631\u0628\u064a:</b> \u0627\u0644\u0645\u0631\u0627\u062f\u0641 \u0627\u0644\u0635\u062d\u064a\u062d \u0644\u0643\u0644\u0645\u0629 'menial' \u0647\u0648 'degrading / unskilled'."}, {"section": 1, "q": "What is the closest meaning to the word/phrase <b>\"skeletal\"</b>?", "options": ["basic framework", "medical", "musical", "full of details"], "ans": 0, "hint": "Hint: Bare bones or outline. (\u062a\u0644\u0645\u064a\u062d: \u0627\u0644\u0647\u064a\u0643\u0644 \u0627\u0644\u0623\u0633\u0627\u0633\u064a)", "exp": "<b>English:</b> The correct synonym for 'skeletal' is 'basic framework'.<br><b>\u0639\u0631\u0628\u064a:</b> \u0627\u0644\u0645\u0631\u0627\u062f\u0641 \u0627\u0644\u0635\u062d\u064a\u062d \u0644\u0643\u0644\u0645\u0629 'skeletal' \u0647\u0648 'basic framework'."}, {"section": 1, "q": "What is the closest meaning to the word/phrase <b>\"welded\"</b>?", "options": ["joined together", "melted", "broken apart", "painted"], "ans": 0, "hint": "Hint: Fused or connected strongly. (\u062a\u0644\u0645\u064a\u062d: \u0645\u0644\u062a\u062d\u0645 \u0623\u0648 \u0645\u062a\u0635\u0644 \u0628\u0642\u0648\u0629)", "exp": "<b>English:</b> The correct synonym for 'welded' is 'joined together'.<br><b>\u0639\u0631\u0628\u064a:</b> \u0627\u0644\u0645\u0631\u0627\u062f\u0641 \u0627\u0644\u0635\u062d\u064a\u062d \u0644\u0643\u0644\u0645\u0629 'welded' \u0647\u0648 'joined together'."}, {"section": 1, "q": "What is the closest meaning to the word/phrase <b>\"optimum\"</b>?", "options": ["unpredictable", "best / most favorable", "worst", "average"], "ans": 1, "hint": "Hint: Peak or ideal condition. (\u062a\u0644\u0645\u064a\u062d: \u0627\u0644\u062d\u0627\u0644\u0629 \u0627\u0644\u0645\u062b\u0627\u0644\u064a\u0629 \u0623\u0648 \u0627\u0644\u0623\u0641\u0636\u0644)", "exp": "<b>English:</b> The correct synonym for 'optimum' is 'best / most favorable'.<br><b>\u0639\u0631\u0628\u064a:</b> \u0627\u0644\u0645\u0631\u0627\u062f\u0641 \u0627\u0644\u0635\u062d\u064a\u062d \u0644\u0643\u0644\u0645\u0629 'optimum' \u0647\u0648 'best / most favorable'."}, {"section": 1, "q": "What is the closest meaning to the word/phrase <b>\"run out of time\"</b>?", "options": ["have no time left", "have plenty of time", "check the clock",             if (userAnswers[currentQ] !== null) {
                div.classList.add('disabled');
                if (idx === q.ans) div.classList.add('correct');
                else if (idx === userAnswers[currentQ]) div.classList.add('incorrect');
            }
            
            optsContainer.appendChild(div);
        });
        
        // Show/Hide Explanation
        const expBox = document.getElementById('explanation-box');
        if (userAnswers[currentQ] !== null) {
            expBox.innerHTML = q.exp;
            expBox.style.display = 'block';
        } else {
            expBox.style.display = 'none';
        }
        
        // Update Buttons
        document.getElementById('btn-prev').style.visibility = currentQ === 0 ? 'hidden' : 'visible';
        
        if (currentQ === questions.length - 1) {
            document.getElementById('btn-next').style.display = 'none';
            document.getElementById('btn-submit').style.display = 'flex';
        } else {
            document.getElementById('btn-next').style.display = 'flex';
            document.getElementById('btn-submit').style.display = 'none';
        }
    }
    
    function toggleHint() {
        const hint = document.getElementById('hint-text');
        hint.style.display = hint.style.display === 'none' ? 'block' : 'none';
    }
    
    function selectOption(selectedIdx) {
        if (userAnswers[currentQ] !== null) return; // already answered
        
        const q = questions[currentQ];
        userAnswers[currentQ] = selectedIdx;
        
        if (selectedIdx === q.ans) {
            scores[q.section]++;
        }
        
        // Re-render to show colors and explanation
        loadQuestion();
    }
    
    function goNext() {
        if (currentQ < questions.length - 1) {
            currentQ++;
            loadQuestion();
        }
    }
    
    function goPrev() {
        if (currentQ > 0) {
            currentQ--;
            loadQuestion();
        }
    }
    
    function submitExam() {
        document.getElementById('exam-container').style.display = 'none';
        const res = document.getElementById('results-screen');
        res.style.display = 'block';
        
        const totalScore = scores[1] + scores[2] + scores[3];
        document.getElementById('final-score').innerText = totalScore + "/140";
        
        document.getElementById('score-sec1').innerText = scores[1];
        document.getElementById('score-sec2').innerText = scores[2];
        document.getElementById('score-sec3').innerText = scores[3];
        
        // Generate tailored feedback in Arabic and English
        let feedback = "<strong>Exam Feedback / تقييم الاختبار:</strong><br><br>";
        
        const p1 = (scores[1]/50)*100;
        const p2 = (scores[2]/40)*100;
        const p3 = (scores[3]/50)*100;
        
        let weakest = "Vocabulary";
        let minP = p1;
        if(p2 < minP) { weakest = "Structure"; minP = p2; }
        if(p3 < minP) { weakest = "Reading"; }
        
        if (minP >= 80) {
            feedback += "ممتاز! أداؤك رائع في جميع الأقسام. أنت مستعد تماماً للامتحان.<br>Excellent! You performed great in all sections. You are fully prepared.";
        } else {
            feedback += `بناءً على إجاباتك، يجب عليك التركيز أكثر ومراجعة قسم: <strong>${weakest}</strong>.<br>`;
            feedback += `Based on your answers, you should focus more on the <strong>${weakest}</strong> section.<br><br>`;
            
            if (weakest === "Vocabulary") {
                feedback += "💡 نصيحة: قم بمراجعة الكلمات المترادفة التي ظهرت في نصوص الاستماع. (Review the synonyms from the listening transcripts).";
            } else if (weakest === "Structure") {
                feedback += "💡 نصيحة: راجع قواعد التوازي وتوافق الأزمنة والأفعال الإلزامية. (Review parallelism, tense agreement, and subjunctive verbs).";
            } else {
                feedback += "💡 نصيحة: تدرب على استخراج الفكرة الرئيسية ومعاني الكلمات من السياق. (Practice extracting the main idea and vocabulary from context).";
            }
        }
        
        document.getElementById('feedback-text').innerHTML = feedback;
    }
    
    // Init
    window.onload = loadQuestion;
</script>
</body>
</html>
